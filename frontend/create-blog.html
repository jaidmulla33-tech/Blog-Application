<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Create blog · Inkwell</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Newsreader:wght@600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="create">
    <main>
      <div class="form-card wide">
        <h2>Write a new blog</h2>
        <form id="blog-form">
          <label for="title">Title</label
          ><input id="title" name="title" required maxlength="100" />
          <label for="category">Category</label
          ><select id="category" name="category">
            <option>Web</option>
            <option>Career</option>
            <option>Tools</option>
            <option>Other</option>
          </select>
          <label for="content">Content</label
          ><textarea id="content" name="content" required></textarea>
          <button class="btn" type="submit">Publish blog</button>
          <p id="msg" class="msg" role="status"></p>
        </form>
      </div>
    </main>
    <script src="js/app.js"></script>
    <script src="js/blog.js"></script>
  </body>
</html>
